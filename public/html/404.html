<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | BLACKWAVE API</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
    :root {
      --bg: #0f1115;
      --card: rgba(27,31,39,0.6);
      --border: rgba(44,47,56,0.5);
      --text: #e6e6e6;
      --muted: #9da3ae;
      --accent: #7a6c55;
      --danger: #ff4c4c;
      --success: #4ecdc4;
      --warning: #ffd166;
      --info: #118ab2;
      --primary: #7a6c55;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #0d0f12, #1b1f27);
      color: var(--text);
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
      line-height: 1.6;
    }
    
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        radial-gradient(circle at 20% 30%, rgba(255, 76, 76, 0.1) 0%, transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(122,108,85,0.1) 0%, transparent 40%),
        radial-gradient(circle at 50% 50%, rgba(27,31,39,0.3) 0%, transparent 60%);
      z-index: -1;
      pointer-events: none;
      animation: gradientShift 15s ease infinite alternate;
    }
    
    @keyframes gradientShift {
      0% { 
        background-position: 0% 50%; 
        transform: scale(1);
      }
      50% { 
        background-position: 100% 50%; 
        transform: scale(1.05);
      }
      100% { 
        background-position: 0% 50%; 
        transform: scale(1);
      }
    }
    
    /* Glitch Effect Container */
    .glitch-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: -1;
      opacity: 0.3;
    }
    
    .glitch-line {
      position: absolute;
      width: 100%;
      height: 2px;
      background: var(--danger);
      animation: glitchMove 0.5s infinite;
      opacity: 0.7;
    }
    
    .glitch-line:nth-child(1) { top: 20%; animation-delay: 0.1s; }
    .glitch-line:nth-child(2) { top: 40%; animation-delay: 0.3s; }
    .glitch-line:nth-child(3) { top: 60%; animation-delay: 0.2s; }
    .glitch-line:nth-child(4) { top: 80%; animation-delay: 0.4s; }
    
    @keyframes glitchMove {
      0% { transform: translateX(-100%); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateX(100%); opacity: 0; }
    }
    
    /* Floating Elements */
    .floating-element {
      position: fixed;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: rgba(122,108,85,0.1);
      border: 2px solid rgba(122,108,85,0.3);
      z-index: -1;
      animation: float 20s infinite linear;
    }
    
    .floating-element:nth-child(1) {
      top: 10%;
      left: 10%;
      width: 80px;
      height: 80px;
      animation-delay: 0s;
    }
    
    .floating-element:nth-child(2) {
      top: 70%;
      left: 5%;
      width: 40px;
      height: 40px;
      animation-delay: -5s;
    }
    
    .floating-element:nth-child(3) {
      top: 20%;
      right: 15%;
      width: 100px;
      height: 100px;
      animation-delay: -10s;
    }
    
    .floating-element:nth-child(4) {
      top: 80%;
      right: 10%;
      width: 60px;
      height: 60px;
      animation-delay: -15s;
    }
    
    @keyframes float {
      0% {
        transform: translate(0, 0) rotate(0deg);
      }
      25% {
        transform: translate(20px, 50px) rotate(90deg);
      }
      50% {
        transform: translate(0, 100px) rotate(180deg);
      }
      75% {
        transform: translate(-20px, 50px) rotate(270deg);
      }
      100% {
        transform: translate(0, 0) rotate(360deg);
      }
    }
    
    /* Main Container */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
      z-index: 1;
    }
    
    /* Error Code Display */
    .error-code {
      font-size: 180px;
      font-weight: 900;
      background: linear-gradient(45deg, var(--danger), #ff6b6b, #ff9a9a);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 20px;
      position: relative;
      text-shadow: 0 0 30px rgba(255, 76, 76, 0.3);
      animation: glitchText 2s infinite;
    }
    
    @keyframes glitchText {
      0% {
        transform: translate(0);
      }
      2% {
        transform: translate(-2px, 2px);
      }
      4% {
        transform: translate(-2px, -2px);
      }
      6% {
        transform: translate(2px, 2px);
      }
      8% {
        transform: translate(2px, -2px);
      }
      10% {
        transform: translate(0);
      }
      100% {
        transform: translate(0);
      }
    }
    
    .error-code::before,
    .error-code::after {
      content: '404';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    
    .error-code::before {
      animation: glitch-anim-1 2.5s infinite linear alternate-reverse;
      clip-path: polygon(0 0, 100% 0, 100% 45%, 0 45%);
      opacity: 0.8;
    }
    
    .error-code::after {
      animation: glitch-anim-2 2.5s infinite linear alternate-reverse;
      clip-path: polygon(0 60%, 100% 60%, 100% 100%, 0 100%);
      opacity: 0.8;
    }
    
    @keyframes glitch-anim-1 {
      0% {
        transform: translate(0);
        opacity: 1;
      }
      10% {
        transform: translate(-8px, 4px);
        opacity: 0.8;
      }
      20% {
        transform: translate(6px, -4px);
        opacity: 0.6;
      }
      30% {
        transform: translate(-6px, 8px);
        opacity: 0.8;
      }
      40% {
        transform: translate(8px, -6px);
        opacity: 0.6;
      }
      50% {
        transform: translate(-4px, 6px);
        opacity: 0.8;
      }
      60% {
        transform: translate(6px, -8px);
        opacity: 0.6;
      }
      70% {
        transform: translate(-8px, 4px);
        opacity: 0.8;
      }
      80% {
        transform: translate(4px, -6px);
        opacity: 0.6;
      }
      90% {
        transform: translate(-6px, 8px);
        opacity: 0.8;
      }
      100% {
        transform: translate(0);
        opacity: 1;
      }
    }
    
    @keyframes glitch-anim-2 {
      0% {
        transform: translate(0);
        opacity: 1;
      }
      10% {
        transform: translate(8px, -4px);
        opacity: 0.8;
      }
      20% {
        transform: translate(-6px, 4px);
        opacity: 0.6;
      }
      30% {
        transform: translate(6px, -8px);
        opacity: 0.8;
      }
      40% {
        transform: translate(-8px, 6px);
        opacity: 0.6;
      }
      50% {
        transform: translate(4px, -6px);
        opacity: 0.8;
      }
      60% {
        transform: translate(-6px, 8px);
        opacity: 0.6;
      }
      70% {
        transform: translate(8px, -4px);
        opacity: 0.8;
      }
      80% {
        transform: translate(-4px, 6px);
        opacity: 0.6;
      }
      90% {
        transform: translate(6px, -8px);
        opacity: 0.8;
      }
      100% {
        transform: translate(0);
        opacity: 1;
      }
    }
    
    /* Error Message */
    .error-title {
      font-size: 36px;
      font-weight: 700;
      margin-bottom: 20px;
      color: var(--text);
      position: relative;
      display: inline-block;
    }
    
    .error-title::after {
      content: '';
      position: absolute;
      bottom: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: 100px;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--danger), transparent);
      border-radius: 2px;
    }
    
    .error-description {
      font-size: 18px;
      color: var(--muted);
      max-width: 600px;
      margin: 0 auto 40px;
      line-height: 1.8;
    }
    
    /* Search Box */
    .search-box {
      max-width: 500px;
      width: 100%;
      margin: 40px auto;
      position: relative;
    }
    
    .search-input {
      width: 100%;
      padding: 18px 60px 18px 25px;
      background: rgba(27,31,39,0.8);
      border: 2px solid var(--border);
      border-radius: 15px;
      color: var(--text);
      font-family: 'Poppins', sans-serif;
      font-size: 16px;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
    }
    
    .search-input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(122,108,85,0.1);
      background: rgba(27,31,39,0.9);
    }
    
    .search-input::placeholder {
      color: var(--muted);
    }
    
    .search-button {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: linear-gradient(135deg, var(--accent), #c0a16b);
      border: none;
      border-radius: 10px;
      width: 45px;
      height: 45px;
      color: #000;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .search-button:hover {
      transform: translateY(-50%) scale(1.1);
      box-shadow: 0 5px 15px rgba(122,108,85,0.3);
    }
    
    /* Action Buttons */
    .action-buttons {
      display: flex;
      gap: 20px;
      margin: 40px 0;
      flex-wrap: wrap;
      justify-content: center;
    }
    
    .btn {
      padding: 16px 32px;
      border-radius: 12px;
      font-family: 'Poppins', sans-serif;
      font-weight: 600;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-decoration: none;
      min-width: 180px;
      border: 2px solid transparent;
    }
    
    .btn-primary {
      background: linear-gradient(135deg, var(--accent), #c0a16b);
      color: #000;
    }
    
    .btn-primary:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 25px rgba(122,108,85,0.3);
      border-color: var(--accent);
    }
    
    .btn-secondary {
      background: rgba(27,31,39,0.8);
      color: var(--text);
      border: 2px solid var(--border);
      backdrop-filter: blur(10px);
    }
    
    .btn-secondary:hover {
      background: rgba(122,108,85,0.1);
      border-color: var(--accent);
      transform: translateY(-3px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }
    
    .btn-tertiary {
      background: rgba(255, 76, 76, 0.1);
      color: var(--danger);
      border: 2px solid rgba(255, 76, 76, 0.3);
      backdrop-filter: blur(10px);
    }
    
    .btn-tertiary:hover {
      background: rgba(255, 76, 76, 0.2);
      border-color: var(--danger);
      transform: translateY(-3px);
      box-shadow: 0 10px 25px rgba(255, 76, 76, 0.1);
    }
    
    /* Status Monitor */
    .status-monitor {
      max-width: 600px;
      width: 100%;
      margin: 40px auto 0;
      background: rgba(27,31,39,0.6);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 30px;
      backdrop-filter: blur(10px);
      position: relative;
      overflow: hidden;
    }
    
    .status-monitor::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at top right, rgba(122,108,85,0.1), transparent 70%);
      pointer-events: none;
    }
    
    .status-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 20px;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    
    .status-title i {
      color: var(--accent);
    }
    
    .status-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 15px;
    }
    
    .status-item {
      background: rgba(15, 17, 21, 0.5);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 15px;
      text-align: center;
      transition: all 0.3s ease;
    }
    
    .status-item:hover {
      background: rgba(122,108,85,0.1);
      border-color: var(--accent);
      transform: translateY(-2px);
    }
    
    .status-item i {
      font-size: 24px;
      margin-bottom: 10px;
      display: block;
    }
    
    .status-item.up i {
      color: var(--success);
    }
    
    .status-item.down i {
      color: var(--danger);
    }
    
    .status-item.warning i {
      color: var(--warning);
    }
    
    .status-label {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 5px;
    }
    
    .status-value {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
    }
    
    /* Error Details */
    .error-details {
      max-width: 800px;
      width: 100%;
      margin: 40px auto 0;
      background: rgba(27,31,39,0.6);
      border: 1px solid rgba(255, 76, 76, 0.3);
      border-radius: 20px;
      padding: 25px;
      backdrop-filter: blur(10px);
    }
    
    .error-details summary {
      cursor: pointer;
      font-weight: 600;
      color: var(--danger);
      padding: 10px;
      list-style: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    
    .error-details summary::-webkit-details-marker {
      display: none;
    }
    
    .error-details summary::after {
      content: '▼';
      transition: transform 0.3s ease;
    }
    
    .error-details[open] summary::after {
      transform: rotate(180deg);
    }
    
    .error-content {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 76, 76, 0.2);
    }
    
    .error-content pre {
      background: rgba(15, 17, 21, 0.8);
      padding: 15px;
      border-radius: 10px;
      overflow-x: auto;
      font-family: 'Consolas', 'Monaco', monospace;
      font-size: 13px;
      color: var(--muted);
      border: 1px solid var(--border);
    }
    
    /* Footer */
    footer {
      margin-top: 60px;
      padding-top: 40px;
      border-top: 1px solid var(--border);
      width: 100%;
      text-align: center;
    }
    
    .footer-links {
      display: flex;
      justify-content: center;
      gap: 30px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }
    
    .footer-links a {
      color: var(--muted);
      text-decoration: none;
      font-size: 14px;
      transition: all 0.3s ease;
    }
    
    .footer-links a:hover {
      color: var(--accent);
    }
    
    .copyright {
      font-size: 14px;
      color: var(--muted);
      opacity: 0.7;
    }
    
    /* Particle Container */
    .particle-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: -1;
    }
    
    .particle {
      position: absolute;
      background: var(--accent);
      border-radius: 50%;
      pointer-events: none;
      opacity: 0.3;
    }
    
    /* Responsive Design */
    @media (max-width: 768px) {
      .error-code {
        font-size: 120px;
      }
      
      .error-title {
        font-size: 28px;
      }
      
      .error-description {
        font-size: 16px;
        padding: 0 20px;
      }
      
      .action-buttons {
        flex-direction: column;
        align-items: center;
      }
      
      .btn {
        width: 100%;
        max-width: 300px;
      }
      
      .search-box {
        max-width: 90%;
      }
      
      .status-grid {
        grid-template-columns: 1fr 1fr;
      }
    }
    
    @media (max-width: 480px) {
      .error-code {
        font-size: 80px;
      }
      
      .error-title {
        font-size: 24px;
      }
      
      .container {
        padding: 20px 15px;
      }
      
      .status-grid {
        grid-template-columns: 1fr;
      }
    }
    
    /* Typing Animation */
    .typing-text {
      display: inline-block;
      overflow: hidden;
      white-space: nowrap;
      border-right: 3px solid var(--accent);
      animation: typing 3.5s steps(40, end), blink-caret 0.75s step-end infinite;
      max-width: 0;
      animation-fill-mode: forwards;
    }
    
    @keyframes typing {
      from { max-width: 0 }
      to { max-width: 100% }
    }
    
    @keyframes blink-caret {
      from, to { border-color: transparent }
      50% { border-color: var(--accent) }
    }
    </style>
</head>
<body>

<!-- Glitch Lines -->
<div class="glitch-container">
    <div class="glitch-line"></div>
    <div class="glitch-line"></div>
    <div class="glitch-line"></div>
    <div class="glitch-line"></div>
</div>

<!-- Floating Elements -->
<div class="floating-element"></div>
<div class="floating-element"></div>
<div class="floating-element"></div>
<div class="floating-element"></div>

<!-- Particle Container -->
<div class="particle-container" id="particles"></div>

<!-- Main Content -->
<div class="container">
    <!-- Error Code -->
    <div class="error-code">404</div>
    
    <!-- Error Message -->
    <h1 class="error-title">
        <span class="typing-text">Page Not Found</span>
    </h1>
    
    <p class="error-description">
        The page you are looking for might have been removed, had its name changed, 
        or is temporarily unavailable. Don't worry, let's get you back on track.
    </p>
    
    
    
    <!-- Action Buttons -->
    <div class="action-buttons">
        <a href="https://blackwave-api.vercel.app/home" class="btn btn-primary">
            <i class="fas fa-home"></i>
            Back to Dashboard
        </a>
        
        <a href="https://blackwave-api.vercel.app/api-list" class="btn btn-secondary">
            <i class="fas fa-book"></i>
            View Documentation
        </a>
        
        <a href="contact.html" class="btn btn-tertiary">
            <i class="fas fa-headset"></i>
            Contact Support
        </a>
    </div>
    
    
    
    <!-- Footer -->        
        <p class="copyright">
            © 2025 BLACKWAVE API Platform • Page generated: <span id="currentTime"></span>
        </p>
    </footer>
</div>

<script>
// Initialize page
document.addEventListener('DOMContentLoaded', function() {
    // Set current time
    const now = new Date();
    document.getElementById('currentTime').textContent = now.toLocaleString();
    document.getElementById('errorTimestamp').textContent = now.toISOString();
    
    // Set requested URL
    document.getElementById('requestedUrl').textContent = window.location.href;
    
    // Set user agent
    document.getElementById('userAgent').textContent = navigator.userAgent.substring(0, 50) + '...';
    
    // Generate random session ID
    document.getElementById('sessionId').textContent = Math.random().toString(36).substr(2, 9).toUpperCase();
    
    // Create particles
    createParticles();
    
    // Simulate active users count
    simulateActiveUsers();
    
    // Add glitch effect periodically
    setInterval(addGlitchEffect, 3000);
    
    // Add typing animation to other elements
    setTimeout(() => {
        document.querySelector('.error-description').style.animation = 'fadeIn 1s ease forwards';
    }, 3500);
});

// Create particle system
function createParticles() {
    const container = document.getElementById('particles');
    const particleCount = 50;
    
    for (let i = 0; i < particleCount; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        
        // Random properties
        const size = Math.random() * 5 + 1;
        const posX = Math.random() * 100;
        const posY = Math.random() * 100;
        const duration = Math.random() * 10 + 10;
        const delay = Math.random() * 5;
        
        particle.style.width = `${size}px`;
        particle.style.height = `${size}px`;
        particle.style.left = `${posX}%`;
        particle.style.top = `${posY}%`;
        particle.style.opacity = Math.random() * 0.2 + 0.1;
        particle.style.background = `rgba(${Math.random() * 50 + 122}, ${Math.random() * 50 + 108}, ${Math.random() * 50 + 85}, 0.3)`;
        
        container.appendChild(particle);
        
        // Animate particle
        animateParticle(particle, duration, delay);
    }
}

// Animate individual particle
function animateParticle(particle, duration, delay) {
    setTimeout(() => {
        const startX = Math.random() * 100;
        const startY = Math.random() * 100;
        const endX = startX + (Math.random() - 0.5) * 40;
        const endY = startY + (Math.random() - 0.5) * 40;
        
        particle.style.left = `${startX}%`;
        particle.style.top = `${startY}%`;
        
        particle.animate([
            { transform: `translate(0, 0)`, opacity: particle.style.opacity },
            { transform: `translate(${endX - startX}%, ${endY - startY}%)`, opacity: 0 }
        ], {
            duration: duration * 1000,
            iterations: Infinity,
            direction: 'alternate',
            easing: 'ease-in-out'
        });
    }, delay * 1000);
}

// Simulate active users count
function simulateActiveUsers() {
    const activeUsersElement = document.getElementById('activeUsers');
    let count = 342;
    
    setInterval(() => {
        const change = Math.floor(Math.random() * 5) - 2;
        count += change;
        
        // Keep within realistic bounds
        if (count < 300) count = 300 + Math.floor(Math.random() * 20);
        if (count > 380) count = 380 - Math.floor(Math.random() * 20);
        
        // Animate the count change
        const current = parseInt(activeUsersElement.textContent);
        if (current !== count) {
            animateCount(activeUsersElement, current, count);
        }
    }, 5000);
}

// Animate number count
function animateCount(element, start, end) {
    const duration = 500;
    const startTime = Date.now();
    
    function update() {
        const elapsed = Date.now() - startTime;
        const progress = Math.min(elapsed / duration, 1);
        const current = Math.floor(start + (end - start) * progress);
        
        element.textContent = current;
        
        if (progress < 1) {
            requestAnimationFrame(update);
        }
    }
    
    update();
}

// Search function
function searchSite() {
    const searchInput = document.getElementById('searchInput');
    const query = searchInput.value.trim();
    
    if (query) {
        // Show loading state
        const searchButton = document.querySelector('.search-button');
        const originalIcon = searchButton.innerHTML;
        searchButton.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
        
        // Simulate search delay
        setTimeout(() => {
            // In production, this would redirect to search results
            alert(`Searching for: "${query}"\n\nThis would redirect to search results in production.`);
            searchButton.innerHTML = originalIcon;
        }, 1000);
    } else {
        // Shake animation for empty input
        searchInput.style.animation = 'shake 0.5s';
        setTimeout(() => {
            searchInput.style.animation = '';
            searchInput.focus();
        }, 500);
    }
}

// Add keypress listener for search
document.getElementById('searchInput').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
        searchSite();
    }
});

// Random glitch effects
function addGlitchEffect() {
    const errorCode = document.querySelector('.error-code');
    const glitchChance = 0.3; // 30% chance
    
    if (Math.random() < glitchChance) {
        errorCode.style.animation = 'none';
        setTimeout(() => {
            errorCode.style.animation = 'glitchText 2s infinite';
        }, 10);
        
        // Add random glitch lines
        const glitchLines = document.querySelectorAll('.glitch-line');
        glitchLines.forEach(line => {
            const randomX = Math.random() * 100;
            line.style.left = `${randomX}%`;
            line.style.width = `${Math.random() * 50 + 50}%`;
        });
    }
}

// Add CSS for shake animation
const style = document.createElement('style');
style.textContent = `
    @keyframes shake {
        0%, 100% { transform: translateX(0); }
        10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
        20%, 40%, 60%, 80% { transform: translateX(5px); }
    }
    
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }
`;
document.head.appendChild(style);

// Handle broken image links
document.addEventListener('error', function(e) {
    if (e.target.tagName === 'IMG') {
        e.target.style.opacity = '0.5';
        e.target.style.filter = 'grayscale(100%)';
    }
}, true);
</script>
