<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
<title>BLACKWAVE API</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="../css/apis.css">

</head>
<body>

<!-- Loading Overlay -->
<div class="loading-overlay" id="loadingOverlay">
  <div class="loading-content">
    <div class="loading-spinner"></div>
    <div class="loading-text">
      Loading<span class="loading-dots"></span><span class="loading-dots"></span><span class="loading-dots"></span>
    </div>
  </div>
</div>

<!-- Header -->
<header class="header">
  <div class="logo-container">
    <div class="logo-icon">
      <i class="fas fa-wave-square"></i>
    </div>
    <div class="logo-text">
      <div class="logo-main">BLACKWAVE</div>
      <div class="logo-sub">API DOCUMENTATION</div>
    </div>
  </div>
  
  <div class="header-actions">
    <div class="sections-dropdown">
      <button id="sectionsToggle">
        <i class="fas fa-layer-group"></i>
        <span>Sections</span>
        <i class="fas fa-chevron-down" style="font-size: 0.7rem;"></i>
      </button>
      <div class="sections-menu" id="sectionsMenu">
        <!-- Sections will be populated dynamically -->
      </div>
    </div>
    
    <button class="logout-btn" id="logoutBtn">
      <i class="fas fa-sign-out-alt"></i>
      <span>Logout</span>
    </button>
  </div>
</header>

<!-- Main Content -->
<main class="main">
  <!-- Stats Section -->
  <div class="stats-container">
    <div class="stat-card">
      <div class="stat-icon">
        <i class="fas fa-code"></i>
      </div>
      <div class="stat-content">
        <div class="stat-value" id="totalApis">0</div>
        <div class="stat-label">TOTAL APIS</div>
      </div>
    </div>
    
    <div class="stat-card">
      <div class="stat-icon">
        <i class="fas fa-check-circle"></i>
      </div>
      <div class="stat-content">
        <div class="stat-value" id="activeApis">0</div>
        <div class="stat-label">ACTIVE APIS</div>
      </div>
    </div>
    
    <div class="stat-card">
      <div class="stat-icon">
        <i class="fas fa-folder"></i>
      </div>
      <div class="stat-content">
        <div class="stat-value" id="totalCategories">0</div>
        <div class="stat-label">CATEGORIES</div>
      </div>
    </div>
    
    <div class="stat-card">
      <div class="stat-icon">
        <i class="fas fa-bolt"></i>
      </div>
      <div class="stat-content">
        <div class="stat-value" id="requestsCount">0</div>
        <div class="stat-label">REQUESTS</div>
      </div>
    </div>
  </div>

  <!-- API Grid -->
  <div class="api-grid" id="apiGrid">
    <!-- API cards will be populated dynamically -->
  </div>
</main>

<!-- Modal -->
<div class="modal" id="responseModal">
  <div class="modal-content">
    <div class="modal-header">
      <div class="modal-title">Response</div>
      <button class="modal-close" id="closeModal">
        <i class="fas fa-times"></i>
      </button>
    </div>
    <div class="modal-body">
      <pre class="modal-response" id="modalResponse"></pre>
    </div>
  </div>
</div>

<script src="../js/apis.js"></script>
</body>
</html>
