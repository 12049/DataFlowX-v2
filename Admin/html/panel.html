<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Panel</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Panel Style -->
  <link rel="stylesheet" href="../css/panel.css">

  <!-- GSAP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <style>
    /* Loader داخلي للكروت */
    .card-loader {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 80px;
      gap: 8px;
      color: var(--muted);
    }
    .loader-circle {
      width: 25px;
      height: 25px;
      border: 3px solid rgba(255,255,255,0.2);
      border-top: 3px solid var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    .loader-text {
      font-size: 0.8em;
      font-weight: 500;
      text-align: center;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Dashboard Grid */
    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    .dashboard-card {
      background: var(--card);
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
      position: relative;
    }
    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .card-header i {
      margin-right: 8px;
    }
    .live-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: red;
      animation: pulse 1.2s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.4); opacity: 1; }
      100% { transform: scale(1); opacity: 0.6; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">Admin Panel</div>
  <div class="nav-icons">
    <i class="fa-solid fa-bars" id="openSidebar"></i>
  </div>
</header>

<!-- Sidebar -->
<div class="sidebar" id="sidebar">
  <i class="fa-solid fa-xmark close-btn" id="closeSidebar"></i>

  <div class="user-info">
    <img src="../../assets/LOGO.jpg">
    <div>
      <strong>API Administrator</strong>
      <span class="muted">Root Access</span>
    </div>
  </div>

  <a href="/admin/dashboard" class="menu-item">
    <span><i class="fa-solid fa-gauge-high"></i> Dashboard</span>
    <div class="dot"></div>
  </a>

  <a href="/admin/apikeys" class="menu-item">
    <span><i class="fa-solid fa-key"></i> Api Key Management</span>
    <div class="dot"></div>
  </a>

  <a href="/admin/manager" class="menu-item">
    <span><i class="fa-solid fa-brain"></i> Add New Api</span>
    <div class="dot"></div>
  </a>

  <a href="/admin/users" class="menu-item">
    <span><i class="fa-solid fa-user"></i> Users</span>
    <div class="dot"></div>
  </a>

  <a href="https://blackwave-api.vercel.app/" class="logout">
    <i class="fa-solid fa-right-from-bracket"></i> Logout
  </a>
</div> <!-- نهاية sidebar -->


<!-- Main Container -->
<div class="container" id="container">

  <!-- Welcome Card -->
  <div class="welcome-card">
    <i class="fa-solid fa-user-shield fa-2x" style="color:var(--accent)"></i>
    <div>
      <h1>Welcome, RADIO!</h1>
      <p>Monitor your bots and manage API access.</p>
    </div>
  </div>

  <!-- Dashboard Grid -->
  <div class="dashboard-grid">

    <!-- Last Requests -->
    <div class="dashboard-card" id="lastRequestsCard">
      <div class="card-header">
        <i class="fa-solid fa-arrows-rotate"></i>
        <span>Last API Requests</span>
        <span class="live-dot"></span>
      </div>
      <div class="card-body" id="lastRequests">
        <div class="card-loader">
          <div class="loader-circle"></div>
          <span class="loader-text">Loading...</span>
        </div>
      </div>
    </div>

    <!-- Online Users -->
    <div class="dashboard-card center" id="onlineUsersCard">
      <div class="card-header">
        <i class="fa-solid fa-users"></i>
        <span>Online Users</span>
        <span class="live-dot" style="background-color: #4caf50;"></span>
      </div>
      <div class="card-body">
        <div class="card-loader">
          <div class="loader-circle"></div>
          <span class="loader-text">Loading...</span>
        </div>
        <h2 id="onlineCount" style="display:none;">0</h2>
      </div>
    </div>

    <!-- New Users -->
    <div class="dashboard-card" id="newUsersCard">
      <div class="card-header">
        <i class="fa-solid fa-user-plus"></i>
        <span>New Users</span>
      </div>
      <div class="card-body" id="newUsers">
        <div class="card-loader">
          <div class="loader-circle"></div>
          <span class="loader-text">Loading...</span>
        </div>
      </div>
    </div>

  </div>
</div>

<!-- Loader Overlay -->
<div id="loaderOverlay">
  <div id="loaderCard">
    <div class="loaderCircle"></div>
    <div class="loaderText">Loading...</div>
  </div>
</div>

<!-- Panel JS -->
<script src="../js/panel.js"></script>

</body>
</html>
