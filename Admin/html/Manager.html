<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel - API Manager</title>

<!-- Fonts & Icons -->
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<!-- Animation Library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>

<style>
/* ===== CSS Variables ===== */
:root {
  --bg-primary: #0f1115;
  --bg-secondary: #1b1f27;
  --card-bg: rgba(27, 31, 39, 0.9);
  --card-border: rgba(255, 255, 255, 0.08);
  --text-primary: #ffffff;
  --text-secondary: #b0b7c3;
  --text-muted: #8a909e;
  --accent-primary: #7a6c55;
  --accent-secondary: #9c8a6b;
  --danger: #ff4757;
  --success: #2ed573;
  --warning: #ffa502;
  --info: #1e90ff;
  --terminal-bg: #0a0a0a;
  --terminal-text: #00ff9d;
  --sidebar-width: 280px;
  --header-height: 70px;
  --border-radius: 12px;
  --transition: all 0.3s ease;
  --shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
  --shadow-light: 0 4px 16px rgba(0, 0, 0, 0.2);
}

/* ===== Reset & Base Styles ===== */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Poppins', sans-serif;
  background: linear-gradient(135deg, #0d0f12 0%, #1b1f27 100%);
  color: var(--text-primary);
  min-height: 100vh;
  overflow-x: hidden;
  line-height: 1.6;
}

/* ===== Header ===== */
.header {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: var(--header-height);
  background: rgba(15, 17, 21, 0.95);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--card-border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 30px;
  z-index: 1000;
}

.header .logo {
  font-size: 24px;
  font-weight: 700;
  background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.header-icons {
  display: flex;
  gap: 20px;
  align-items: center;
}

.icon-btn {
  width: 40px;
  height: 40px;
  border-radius: 10px;
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  color: var(--text-primary);
  font-size: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: var(--transition);
}

.icon-btn:hover {
  background: var(--accent-primary);
  transform: translateY(-2px);
  box-shadow: var(--shadow-light);
}

/* ===== Sidebar ===== */
.sidebar {
  position: fixed;
  top: var(--header-height);
  left: -100%;
  width: var(--sidebar-width);
  height: calc(100vh - var(--header-height));
  background: var(--card-bg);
  backdrop-filter: blur(20px);
  border-right: 1px solid var(--card-border);
  padding: 25px 0;
  transition: var(--transition);
  z-index: 999;
  overflow-y: auto;
}

.sidebar.active {
  left: 0;
}

.sidebar-close {
  position: absolute;
  top: 15px;
  right: 15px;
  font-size: 20px;
  cursor: pointer;
  color: var(--text-secondary);
  transition: var(--transition);
}

.sidebar-close:hover {
  color: var(--danger);
}

.user-profile {
  display: flex;
  align-items: center;
  gap: 15px;
  padding: 0 25px 25px;
  border-bottom: 1px solid var(--card-border);
  margin-bottom: 20px;
}

.user-avatar {
  width: 60px;
  height: 60px;
  border-radius: 50%;
  object-fit: cover;
  border: 3px solid var(--accent-primary);
  padding: 2px;
}

.user-info h4 {
  font-size: 16px;
  font-weight: 600;
  margin-bottom: 5px;
}

.user-info p {
  font-size: 12px;
  color: var(--text-muted);
  background: rgba(122, 108, 85, 0.1);
  padding: 2px 8px;
  border-radius: 20px;
  display: inline-block;
}

.menu {
  list-style: none;
  padding: 0 20px;
}

.menu-item {
  margin-bottom: 5px;
}

.menu-link {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 15px;
  color: var(--text-secondary);
  text-decoration: none;
  border-radius: 10px;
  transition: var(--transition);
  font-weight: 500;
}

.menu-link:hover,
.menu-link.active {
  background: rgba(122, 108, 85, 0.15);
  color: var(--accent-secondary);
  border-left: 3px solid var(--accent-primary);
}

.menu-link i {
  width: 20px;
  font-size: 16px;
}

.logout-btn {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 25px;
  color: var(--danger);
  text-decoration: none;
  margin-top: 20px;
  border-top: 1px solid var(--card-border);
  font-weight: 500;
  transition: var(--transition);
}

.logout-btn:hover {
  color: #fff;
  background: rgba(255, 71, 87, 0.1);
}

/* ===== Main Content ===== */
.container {
  margin-top: var(--header-height);
  padding: 30px;
  transition: var(--transition);
  max-width: 1400px;
  margin-left: auto;
  margin-right: auto;
}

.container.shift {
  margin-left: var(--sidebar-width);
}

/* ===== Dashboard Grid ===== */
.dashboard-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
  gap: 25px;
  margin-bottom: 40px;
}

/* ===== API Form Card ===== */
.api-form-card {
  background: var(--card-bg);
  border-radius: var(--border-radius);
  padding: 25px;
  border: 1px solid var(--card-border);
  box-shadow: var(--shadow);
}

.card-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 25px;
  padding-bottom: 15px;
  border-bottom: 1px solid var(--card-border);
}

.card-header i {
  color: var(--accent-primary);
  font-size: 20px;
}

.card-header h2 {
  font-size: 20px;
  font-weight: 600;
}

.form-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 20px;
  margin-bottom: 25px;
}

.form-group {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.form-group label {
  font-size: 13px;
  color: var(--text-secondary);
  font-weight: 500;
}

.form-group input,
.form-group select {
  padding: 12px 15px;
  background: rgba(44, 47, 56, 0.4);
  border: 1px solid var(--card-border);
  border-radius: 8px;
  color: var(--text-primary);
  font-size: 14px;
  transition: var(--transition);
}

.form-group input:focus,
.form-group select:focus {
  outline: none;
  border-color: var(--accent-primary);
  box-shadow: 0 0 0 3px rgba(122, 108, 85, 0.2);
}

.form-actions {
  display: flex;
  gap: 15px;
  justify-content: flex-end;
}

.btn {
  padding: 12px 30px;
  border: none;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: var(--transition);
  display: flex;
  align-items: center;
  gap: 8px;
}

.btn-primary {
  background: var(--accent-primary);
  color: white;
}

.btn-primary:hover {
  background: var(--accent-secondary);
  transform: translateY(-2px);
  box-shadow: var(--shadow-light);
}

.btn-secondary {
  background: rgba(44, 47, 56, 0.4);
  color: var(--text-primary);
  border: 1px solid var(--card-border);
}

.btn-secondary:hover {
  background: rgba(44, 47, 56, 0.8);
  transform: translateY(-2px);
}

/* ===== Terminal Card ===== */
.terminal-card {
  background: var(--card-bg);
  border-radius: var(--border-radius);
  padding: 25px;
  border: 1px solid var(--card-border);
  box-shadow: var(--shadow);
  height: 100%;
}

.terminal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}

.terminal-title {
  display: flex;
  align-items: center;
  gap: 10px;
}

.terminal-title i {
  color: var(--terminal-text);
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}

.terminal-actions {
  display: flex;
  gap: 10px;
}

.api-terminal {
  background: var(--terminal-bg);
  border-radius: 8px;
  padding: 20px;
  font-family: 'Fira Code', monospace;
  font-size: 13px;
  color: var(--terminal-text);
  height: 300px;
  overflow-y: auto;
  border: 1px solid rgba(0, 255, 157, 0.2);
  line-height: 1.8;
}

.api-terminal::-webkit-scrollbar {
  width: 8px;
}

.api-terminal::-webkit-scrollbar-track {
  background: rgba(0, 0, 0, 0.2);
}

.api-terminal::-webkit-scrollbar-thumb {
  background: var(--accent-primary);
  border-radius: 4px;
}

/* ===== Sections Card ===== */
.sections-card {
  background: var(--card-bg);
  border-radius: var(--border-radius);
  padding: 25px;
  border: 1px solid var(--card-border);
  box-shadow: var(--shadow);
  margin-top: 25px;
}

.sections-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}

.sections-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 15px;
}

.section-btn {
  background: rgba(44, 47, 56, 0.4);
  padding: 15px;
  border-radius: 8px;
  text-align: center;
  cursor: pointer;
  transition: var(--transition);
  border: 1px solid transparent;
  font-size: 14px;
  font-weight: 500;
  color: var(--text-primary);
  border: none;
}

.section-btn:hover {
  background: rgba(122, 108, 85, 0.2);
  border-color: var(--accent-primary);
  transform: translateY(-2px);
}

.section-btn.active {
  background: rgba(122, 108, 85, 0.3);
  border-color: var(--accent-primary);
  color: var(--accent-secondary);
}

/* ===== Modal ===== */
.modal {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.8);
  backdrop-filter: blur(5px);
  z-index: 2000;
  animation: fadeIn 0.3s ease;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

/* Fullscreen modal */
.full-screen .modal-content {
  width: 100%;
  height: 100%;
  border-radius: 0;
  display: flex;
  flex-direction: column;
  background: #1e1e2f;
  color: #e6e6e6;
  font-family: 'Fira Code', monospace;
  font-size: 13px;
}

/* Header */
.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 16px;
  background: #252536;
  border-bottom: 1px solid #3a3a4f;
}

.modal-actions button {
  margin-left: 6px;
  background: #2a2e39;
  color: #e6e6e6;
  border: none;
  padding: 4px 8px;
  border-radius: 4px;
  cursor: pointer;
  font-size: 12px;
}

.modal-actions button:hover {
  background: #3a3e49;
}

.close-btn {
  cursor: pointer;
  font-size: 18px;
}

/* Breadcrumb */
.breadcrumb {
  padding: 4px 16px;
  background: #1b1d2c;
  font-size: 12px;
  color: #999;
}

.breadcrumb span {
  cursor: pointer;
}

.breadcrumb span:hover {
  text-decoration: underline;
}

/* Body split: file list + editor */
.file-manager-body {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* File list */
.file-list {
  width: 28%;
  background: #1b1d2c;
  overflow-y: auto;
  border-right: 1px solid #3a3a4f;
  padding: 8px;
  font-size: 13px;
}

.file-list div {
  padding: 6px 8px;
  cursor: pointer;
  border-radius: 4px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  color: var(--text-primary);
}

.file-list div:hover {
  background: rgba(255,255,255,0.05);
}

/* Editor */
.file-editor {
  flex: 1;
  display: none;
  flex-direction: column;
  background: #1e1e2f;
}

.editor-header {
  display: flex;
  justify-content: space-between;
  padding: 4px 10px;
  background: #252536;
  border-bottom: 1px solid #3a3a4f;
  font-size: 13px;
}

#editorArea {
  flex: 1;
  width: 100%;
  background: #1e1e2f;
  border: none;
  color: #e6e6e6;
  padding: 8px;
  resize: none;
  font-family: 'Fira Code', monospace;
  font-size: 13px;
}

.editor-actions {
  padding: 4px 10px;
  border-top: 1px solid #3a3a4f;
  display: flex;
  justify-content: flex-end;
}

.editor-actions button {
  background: #2a2e39;
  border: none;
  color: #e6e6e6;
  padding: 4px 8px;
  border-radius: 4px;
  cursor: pointer;
  font-size: 12px;
}

.editor-actions button:hover {
  background: #3a3e49;
}

/* Scrollbars */
.file-list::-webkit-scrollbar, #editorArea::-webkit-scrollbar {
  width: 6px;
}

.file-list::-webkit-scrollbar-thumb, #editorArea::-webkit-scrollbar-thumb {
  background-color: rgba(255,255,255,0.2);
  border-radius: 3px;
}

/* ===== Loader ===== */
#loaderOverlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.9);
  backdrop-filter: blur(10px);
  z-index: 3000;
  display: none;
  align-items: center;
  justify-content: center;
}

#loaderCard {
  background: var(--card-bg);
  padding: 30px 40px;
  border-radius: 18px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
  backdrop-filter: blur(15px);
  box-shadow: var(--shadow);
  border: 1px solid var(--card-border);
}

.loaderCircle {
  width: 50px;
  height: 50px;
  border: 4px solid rgba(255, 255, 255, 0.2);
  border-top: 4px solid var(--accent-primary);
  border-radius: 50%;
  animation: spin 1s linear infinite;
}

.loaderText {
  color: var(--text-primary);
  font-weight: 600;
  font-size: 16px;
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

/* ===== Responsive Design ===== */
@media (max-width: 1024px) {
  .dashboard-grid {
    grid-template-columns: 1fr;
  }
  
  .container {
    padding: 20px;
  }
  
  .form-grid {
    grid-template-columns: 1fr;
  }
}

@media (max-width: 768px) {
  .header {
    padding: 0 20px;
  }
  
  .header .logo {
    font-size: 20px;
  }
  
  .container {
    padding: 15px;
  }
  
  .sections-grid {
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
  }
}

@media (max-width: 480px) {
  :root {
    --header-height: 60px;
  }
  
  .header {
    padding: 0 15px;
  }
  
  .icon-btn {
    width: 35px;
    height: 35px;
    font-size: 14px;
  }
  
  .btn {
    padding: 10px 20px;
    font-size: 13px;
  }
  
  .card-header h2 {
    font-size: 18px;
  }
}

/* ===== Custom Scrollbar ===== */
::-webkit-scrollbar {
  width: 10px;
}

::-webkit-scrollbar-track {
  background: rgba(0, 0, 0, 0.2);
}

::-webkit-scrollbar-thumb {
  background: var(--accent-primary);
  border-radius: 5px;
}

::-webkit-scrollbar-thumb:hover {
  background: var(--accent-secondary);
}

/* ===== Utility Classes ===== */
.text-success { color: var(--success); }
.text-danger { color: var(--danger); }
.text-warning { color: var(--warning); }
.text-info { color: var(--info); }
.text-muted { color: var(--text-muted); }

.mt-20 { margin-top: 20px; }
.mb-20 { margin-bottom: 20px; }
.mt-30 { margin-top: 30px; }
.mb-30 { margin-bottom: 30px; }

.fade-in {
  animation: fadeIn 0.5s ease;
}

/* ===== Terminal Output Styles ===== */
.terminal-output {
  margin: 0;
  font-family: 'Fira Code', monospace;
  font-size: 13px;
  line-height: 1.5;
  white-space: pre-wrap;
  word-wrap: break-word;
}

/* ===== Status Badges ===== */
.status-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 12px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 600;
}

.status-online {
  background: rgba(46, 213, 115, 0.15);
  color: var(--success);
}

.status-offline {
  background: rgba(255, 71, 87, 0.15);
  color: var(--danger);
}
</style>

<body>
<!-- Header -->
<header class="header">
  <div class="logo">API Manager</div>
  <div class="header-icons">
    <button class="icon-btn" id="openFileManagerBtn" title="Open GitHub Project">
      <i class="fa-solid fa-plus"></i>
    </button>
    <button class="icon-btn" id="openSidebar" title="Toggle Menu">
      <i class="fa-solid fa-bars"></i>
    </button>
  </div>
</header>

<!-- File Manager Modal Fullscreen -->
<div id="fileManagerModal" class="modal full-screen">
  <div class="modal-content">
    <div class="modal-header">
      <h3>Project Files</h3>
      <div class="modal-actions">
        <button id="addFileBtn"><i class="fa-solid fa-plus"></i></button>
        <button id="deleteFileBtn"><i class="fa-solid fa-trash"></i></button>
        <button id="uploadFileBtn"><i class="fa-solid fa-upload"></i></button>
      </div>
      <span id="closeFileManager" class="close-btn">&times;</span>
    </div>

    <!-- Breadcrumb Path -->
    <div class="breadcrumb" id="breadcrumb"></div>

    <div class="file-manager-body">
      <!-- Files & Folders List -->
      <div class="file-list" id="fileList">
        <p>Loading files...</p>
      </div>

      <!-- Editor Panel -->
      <div class="file-editor" id="fileEditor">
        <div class="editor-header">
          <span id="editorFileName">File Name</span>
          <span id="closeEditor" class="close-btn">&times;</span>
        </div>
        <textarea id="editorArea" spellcheck="false"></textarea>
        <div class="editor-actions">
          <button id="saveFileBtn"><i class="fa-solid fa-floppy-disk"></i> Save</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Sidebar -->
<div class="sidebar" id="sidebar">
  <i class="fa-solid fa-xmark sidebar-close" id="closeSidebar"></i>

  <div class="user-profile">
    <img src="https://ui-avatars.com/api/?name=API+Admin&background=7a6c55&color=fff&bold=true" alt="Admin" class="user-avatar">
    <div class="user-info">
      <h4>API Administrator</h4>
      <p>Root Access</p>
    </div>
  </div>

  <ul class="menu">
    <li class="menu-item">
      <a href="/admin/panel" class="menu-link active">
        <i class="fa-solid fa-gauge-high"></i>
        <span>Dashboard</span>
      </a>
    </li>
    <li class="menu-item">
      <a href="/admin/apikeys" class="menu-link">
        <i class="fa-solid fa-key"></i>
        <span>Api Key Management</span>
      </a>
    </li>
    <li class="menu-item">
      <a href="/admin/users" class="menu-link">
        <i class="fa-solid fa-user"></i>
        <span>Users</span>
      </a>
    </li>
    <li class="menu-item">
      <a href="https://blackwave-api.vercel.app/" class="logout-btn">
        <i class="fa-solid fa-right-from-bracket"></i>
        <span>Logout</span>
      </a>
    </li>
  </ul>
</div>

<!-- Loader Overlay -->
<div id="loaderOverlay">
  <div id="loaderCard">
    <div class="loaderCircle"></div>
    <div class="loaderText">Processing...</div>
  </div>
</div>

<!-- Main Container -->
<div class="container" id="container">
  <!-- Dashboard Grid -->
  <section class="dashboard-grid">
    <!-- API Form -->
    <div class="api-form-card">
      <div class="card-header">
        <i class="fa-solid fa-plus-circle"></i>
        <h2>Add New API</h2>
      </div>
      
      <div class="form-grid">
        <div class="form-group">
          <label for="sectionInput">Section:</label>
          <input type="text" id="sectionInput" placeholder="e.g. download">
        </div>
        
        <div class="form-group">
          <label for="nameInput">Name:</label>
          <input type="text" id="nameInput" placeholder="API name">
        </div>
        
        <div class="form-group">
          <label for="endpointInput">Endpoint:</label>
          <input type="text" id="endpointInput" placeholder="api/v1/download/youtube">
        </div>
        
        <div class="form-group">
          <label for="fullInput">Full API:</label>
          <input type="text" id="fullInput" placeholder="https://example.com/api/v1/download/youtube">
        </div>
        
        <div class="form-group">
          <label for="queryInput">Query Params:</label>
          <input type="text" id="queryInput" placeholder="url, id,...">
        </div>
        
        <div class="form-group">
          <label for="statusInput">Status:</label>
          <select id="statusInput">
            <option value="active" selected>online</option>
            <option value="disabled">offline</option>
          </select>
        </div>
      </div>
      
      <div class="form-actions">
        <button class="btn btn-primary" id="addApiBtn">
          <i class="fa-solid fa-plus"></i>
          Add API
        </button>
      </div>
    </div>
    
    <!-- Terminal -->
    <div class="terminal-card">
      <div class="terminal-header">
        <div class="terminal-title">
          <i class="fa-solid fa-terminal"></i>
          <h2>Terminal</h2>
        </div>
        <div class="terminal-actions">
          <button class="icon-btn" id="showAllBtn">
            <i class="fa-solid fa-list"></i>
          </button>
        </div>
      </div>
      
      <div class="api-terminal">
        <pre id="terminalOutput" class="terminal-output"></pre>
      </div>
    </div>
  </section>
  
  <!-- API Sections -->
  <section class="sections-card">
    <div class="sections-header">
      <div class="card-header">
        <i class="fa-solid fa-folder"></i>
        <h2>Sections</h2>
      </div>
    </div>
    
    <div class="sections-grid" id="sectionsList">
      <!-- Sections will be injected here -->
    </div>
  </section>
</div>

<script>
// DOM Elements
const addApiBtn = document.getElementById("addApiBtn");
const sectionInput = document.getElementById("sectionInput");
const nameInput = document.getElementById("nameInput");
const endpointInput = document.getElementById("endpointInput");
const fullInput = document.getElementById("fullInput");
const queryInput = document.getElementById("queryInput");
const statusInput = document.getElementById("statusInput");
const terminalOutput = document.getElementById("terminalOutput");
const sectionsList = document.getElementById("sectionsList");
const showAllBtn = document.getElementById("showAllBtn");
const fileManagerModal = document.getElementById('fileManagerModal');
const openFileManagerBtn = document.getElementById('openFileManagerBtn');
const closeFileManagerBtn = document.getElementById('closeFileManager');

const fileListEl = document.getElementById('fileList');
const breadcrumbEl = document.getElementById('breadcrumb');

const fileEditor = document.getElementById('fileEditor');
const editorArea = document.getElementById('editorArea');
const editorFileName = document.getElementById('editorFileName');
const closeEditorBtn = document.getElementById('closeEditor');
const saveFileBtn = document.getElementById('saveFileBtn');

const addFileBtn = document.getElementById('addFileBtn');
const deleteFileBtn = document.getElementById('deleteFileBtn');
const uploadFileBtn = document.getElementById('uploadFileBtn');
const loaderOverlay = document.getElementById('loaderOverlay');

// GitHub Config
const GITHUB_USER = "fazbear-Official";
const GITHUB_REPO = "BLACKWAVE_API";
const GITHUB_TOKEN = "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";
const BRANCH = "main";

let currentPath = "";
let selectedFile = null;

// Helper Functions
function showLoader() {
  loaderOverlay.style.display = 'flex';
  gsap.fromTo(loaderOverlay, 
    { opacity: 0 },
    { opacity: 1, duration: 0.3 }
  );
}

function hideLoader() {
  gsap.to(loaderOverlay, {
    opacity: 0,
    duration: 0.3,
    onComplete: () => {
      loaderOverlay.style.display = 'none';
    }
  });
}

// Write to terminal with styling
function writeTerminal(msg, delay=0){
  setTimeout(()=>{
    const timestamp = new Date().toLocaleTimeString();
    terminalOutput.innerHTML += `\n<span class="text-success">[${timestamp}]</span> ${msg}`;
    terminalOutput.scrollTop = terminalOutput.scrollHeight;
  }, delay);
}

// ===== GitHub File Management Functions =====
// Fetch GitHub files
async function fetchFiles(path="") {
  const url = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${path}?ref=${BRANCH}`;
  const res = await fetch(url, {
    headers: { "Authorization": `token ${GITHUB_TOKEN}` }
  });
  return await res.json();
}

// Render breadcrumb
function renderBreadcrumb() {
  const parts = currentPath.split("/").filter(p=>p);
  breadcrumbEl.innerHTML = "";
  let fullPath = "";
  parts.forEach((part, i)=>{
    fullPath += part + "/";
    const span = document.createElement('span');
    span.textContent = part;
    span.style.cursor = "pointer";
    span.addEventListener('click', ()=> {
      currentPath = fullPath.slice(0,-1);
      loadFiles(currentPath);
    });
    breadcrumbEl.appendChild(span);
    if(i < parts.length-1) breadcrumbEl.appendChild(document.createTextNode(" / "));
  });
}

// Load files
async function loadFiles(path="") {
  showLoader();
  fileEditor.style.display = "none";
  fileListEl.innerHTML = "<p>Loading...</p>";
  currentPath = path;
  renderBreadcrumb();
  try {
    const files = await fetchFiles(path);
    fileListEl.innerHTML = "";
    files.forEach(f=>{
      const div = document.createElement('div');
      div.textContent = f.name + (f.type==="dir"?"/":"");
      div.addEventListener('click', ()=>{
        if(f.type==="dir") {
          loadFiles(f.path);
        } else {
          openEditor(f.path);
        }
        selectedFile = f;
      });
      fileListEl.appendChild(div);
    });
    writeTerminal(`Loaded files from: ${path || 'root'}`, 'info');
  } catch(err){
    fileListEl.innerHTML = `<p class="text-danger">Error: ${err.message}</p>`;
    writeTerminal(`Error loading files: ${err.message}`, 'error');
  } finally {
    hideLoader();
  }
}

// Open file in editor
async function openEditor(path){
  showLoader();
  try {
    const url = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${path}?ref=${BRANCH}`;
    const res = await fetch(url, {
      headers: { "Authorization": `token ${GITHUB_TOKEN}` }
    });
    const file = await res.json();
    const content = atob(file.content);
    editorArea.value = content;
    editorFileName.textContent = file.name;
    fileEditor.style.display = "flex";
    fileEditor.dataset.path = path;
    writeTerminal(`Opened file: ${file.name}`, 'success');
  } catch(err) {
    writeTerminal(`Error opening file: ${err.message}`, 'error');
  } finally {
    hideLoader();
  }
}

// Close editor
closeEditorBtn.addEventListener('click', ()=> {
  fileEditor.style.display = "none";
  writeTerminal('Editor closed', 'info');
});

// Save file
saveFileBtn.addEventListener('click', async ()=>{
  showLoader();
  const content = editorArea.value;
  const path = fileEditor.dataset.path;
  
  try {
    const sha = await getFileSha(path);
    const url = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${path}`;
    const res = await fetch(url, {
      method: "PUT",
      headers: { "Authorization": `token ${GITHUB_TOKEN}`, "Content-Type": "application/json" },
      body: JSON.stringify({
        message: `Update ${path}`,
        content: btoa(content),
        sha
      })
    });
    
    if(res.ok) {
      writeTerminal(`File saved: ${path}`, 'success');
      alert("File saved successfully!");
    } else {
      throw new Error('Failed to save file');
    }
  } catch(err){ 
    writeTerminal(`Error saving file: ${err.message}`, 'error');
    alert("Error: " + err.message);
  } finally {
    hideLoader();
  }
});

// Get SHA
async function getFileSha(path){
  const url = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${path}?ref=${BRANCH}`;
  const res = await fetch(url,{headers:{ "Authorization": `token ${GITHUB_TOKEN}`}});
  const file = await res.json();
  return file.sha;
}

// Open modal
openFileManagerBtn.addEventListener('click', ()=>{
  fileManagerModal.style.display='block';
  gsap.from(fileManagerModal.querySelector('.modal-content'), {scale:0.8, opacity:0, duration:0.4, ease:"back.out(1.7)"});
  loadFiles();
});

// Close modal
closeFileManagerBtn.addEventListener('click', ()=>{
  gsap.to(fileManagerModal.querySelector('.modal-content'), {scale:0.8, opacity:0, duration:0.3, ease:"back.in(1.7)", onComplete: ()=>{
    fileManagerModal.style.display = 'none';
  }});
});

// Add File
addFileBtn.addEventListener('click', ()=>{ 
  const name = prompt("Enter new file name:");
  if(name) createFile(name);
});

// Delete File
deleteFileBtn.addEventListener('click', ()=>{
  if(!selectedFile) return alert("Select a file first!");
  if(confirm(`Delete ${selectedFile.name}?`)){
    deleteFile(selectedFile.path);
  }
});

// Upload File
uploadFileBtn.addEventListener('click', ()=>{
  const input = document.createElement('input');
  input.type='file';
  input.onchange = async e=>{
    const file = e.target.files[0];
    const reader = new FileReader();
    reader.onload = async ()=>{
      await uploadFile(file.name, reader.result);
    };
    reader.readAsBinaryString(file);
  };
  input.click();
});

// TODO: createFile, deleteFile, uploadFile functions باستخدام GitHub API
// ======================
// Sidebar Toggle
// ======================
const sidebar = document.getElementById('sidebar');
const container = document.getElementById('container');

document.getElementById('openSidebar').addEventListener('click', ()=>{
  sidebar.classList.add('active');
  container.classList.add('shift');
  gsap.fromTo(sidebar,
    { x: -300 },
    { x: 0, duration: 0.4, ease: "power3.out" }
  );
});

document.getElementById('closeSidebar').addEventListener('click', ()=>{
  sidebar.classList.remove('active');
  container.classList.remove('shift');
});

// ===== API Management Functions =====
const API_BASE = "https://blackwave-api.vercel.app/api/v2/auth/";

// Load all sections
async function loadSections(){
  showLoader();
  try{
    const res = await fetch(`${API_BASE}/add-api/get-api`);
    const data = await res.json();
    sectionsList.innerHTML = "";
    for(let section in data){
      const btn = document.createElement("button");
      btn.className = "section-btn";
      btn.textContent = section;
      btn.onclick = ()=>showSection(section);
      sectionsList.appendChild(btn);
    }
    writeTerminal(`Loaded ${Object.keys(data).length} sections`, 'success');
  }catch(err){
    writeTerminal(`Error loading sections: ${err.message}`, 'error');
  } finally {
    hideLoader();
  }
}

// Show Section APIs
async function showSection(section){
  showLoader();
  writeTerminal(`Loading APIs for section "${section}"...`, 'info');
  try{
    const res = await fetch(`${API_BASE}/add-api/get-api/${section}`);
    const data = await res.json();
    writeTerminal(JSON.stringify({[section]: data}, null, 2));
    writeTerminal(`Found ${Object.keys(data).length} APIs in ${section}`, 'success');
  }catch(err){
    writeTerminal(`Error: ${err.message}`, 'error');
  } finally {
    hideLoader();
  }
}

// Show All APIs
showAllBtn.onclick = async ()=>{
  showLoader();
  writeTerminal("Loading all APIs...", 'info');
  try{
    const res = await fetch(`${API_BASE}/add-api/get-api`);
    const data = await res.json();
    writeTerminal(JSON.stringify(data, null, 2));
    writeTerminal(`Total APIs loaded: ${Object.keys(data).length}`, 'success');
  }catch(err){
    writeTerminal(`Error: ${err.message}`, 'error');
  } finally {
    hideLoader();
  }
};

// Add API
addApiBtn.onclick = async ()=>{
  const section = sectionInput.value.trim();
  const name = nameInput.value.trim();
  const endpoint = endpointInput.value.trim();
  const full = fullInput.value.trim();
  const query = queryInput.value.trim();
  const status = statusInput.value;

  if(!section || !name || !endpoint || !full){
    writeTerminal("Error: Missing required fields.", 'error');
    return;
  }

  showLoader();
  writeTerminal(`Adding API "${name}" in section "${section}"...`, 'info');

  try{
    const res = await fetch(`${API_BASE}/add-api`, {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({section,name,endpoint,full,query,status})
    });
    const data = await res.json();
    if(data.success){
      writeTerminal(`Success: API added.`, 'success');
      // Clear form
      sectionInput.value = '';
      nameInput.value = '';
      endpointInput.value = '';
      fullInput.value = '';
      queryInput.value = '';
      statusInput.value = 'active';
      // Refresh sections
      loadSections();
    }else{
      writeTerminal(`Error: ${data.error}`, 'error');
    }
  }catch(err){
    writeTerminal(`Error: ${err.message}`, 'error');
  } finally {
    hideLoader();
  }
};

// ===== Initial load =====
document.addEventListener('DOMContentLoaded', () => {
  writeTerminal("API Manager initialized", 'success');
  loadSections();
  
  // Add animation to cards
  gsap.from('.api-form-card, .terminal-card', {
    y: 50,
    opacity: 0,
    stagger: 0.2,
    duration: 0.8,
    ease: "back.out(1.7)"
  });
  
  gsap.from('.sections-card', {
    y: 50,
    opacity: 0,
    delay: 0.3,
    duration: 0.8,
    ease: "back.out(1.7)"
  });
});

// Keyboard shortcuts
document.addEventListener('keydown', (e) => {
  // Ctrl + S to save in editor
  if (e.ctrlKey && e.key === 's' && fileEditor.style.display === 'flex') {
    e.preventDefault();
    saveFileBtn.click();
  }
  
  // Escape to close modal
  if (e.key === 'Escape' && fileManagerModal.style.display === 'block') {
    closeFileManagerBtn.click();
  }
});
</script>
</body>
  </html>
